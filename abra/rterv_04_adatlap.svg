<text x="40" y="98" font-size="13" fill="#5865F2" text-anchor="start">‹ Vissza a kínálathoz</text>
<text x="40" y="132" font-size="24" fill="#2f3b52" text-anchor="start" font-weight="bold">Black Jack</text>
<text x="40" y="156" font-size="13" fill="#555" text-anchor="start">Kategória: Kártya · Szabályverzió: 1.0</text>
<rect x="40" y="175" width="520" height="330" rx="8" fill="white" stroke="#2f3b52" stroke-width="1"/>
<text x="60" y="205" font-size="17" fill="#2f3b52" text-anchor="start" font-weight="bold">Szabályok</text>
<text x="60" y="235" font-size="13" fill="#2f3b52" text-anchor="start">Cél: 21-hez közelebbi lapértéket elérni, mint az osztó.</text>
<text x="60" y="261" font-size="13" fill="#2f3b52" text-anchor="start">Műveletek: Lap kérése, Megállás.</text>
<text x="60" y="287" font-size="13" fill="#2f3b52" text-anchor="start">Befejezés: megállás, 21 felett vagy az osztó lépései után.</text>
<text x="60" y="313" font-size="13" fill="#2f3b52" text-anchor="start"></text>
<text x="60" y="339" font-size="13" fill="#2f3b52" text-anchor="start">Téthatár: 10 – 500 zseton, 10-es lépcsőben.</text>
<text x="60" y="365" font-size="13" fill="#2f3b52" text-anchor="start">Kifizetés: nyerés esetén a tét kétszerese, döntetlennél</text>
<text x="60" y="391" font-size="13" fill="#2f3b52" text-anchor="start">a tét visszajár, vereségnél a jóváírás 0.</text>
<text x="60" y="417" font-size="13" fill="#2f3b52" text-anchor="start"></text>
<text x="60" y="443" font-size="13" fill="#2f3b52" text-anchor="start">Példa: 1000 − 100 + 200 = 1100 zseton (nettó +100).</text>
<rect x="590" y="175" width="270" height="200" rx="8" fill="#eef1f6" stroke="#2f3b52" stroke-width="1"/>
<text x="610" y="205" font-size="15" fill="#2f3b52" text-anchor="start" font-weight="bold">Indítás előtt</text>
<text x="610" y="235" font-size="13" fill="#2f3b52" text-anchor="start">Egyenleged: 1 000 zseton</text>
<text x="610" y="260" font-size="13" fill="#2f3b52" text-anchor="start">Megengedett tét: 10 – 500</text>
<rect x="610" y="285" width="230" height="36" rx="6" fill="#5865F2" stroke="#5865F2" stroke-width="1.3"/>
<text x="725.0" y="308.0" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Játék indítása</text>
<text x="610" y="350" font-size="11" fill="#555" text-anchor="start">A tétet a következő lépésben adod meg.</text>
<rect x="590" y="395" width="270" height="32" rx="6" fill="white" stroke="#2f3b52" stroke-width="1.3"/>
<text x="725.0" y="416.0" font-size="13" fill="#2f3b52" text-anchor="middle">Súgó a játékhoz</text>
